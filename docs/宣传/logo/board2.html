<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>SEEN logo 草图 v2</title>
<!--
  v2：放弃衣架。核心是问号的“点”——问题被回答后只剩一个点（句号），也是海报里顶灯的光点。
  A = SEEN. 字标（香槟句点）；B = 镜面图形标 + SEEN；C = 中文字标「衣见。」。
  第二行为各自的 App 图标。配色取自 docs/design/visual-v04/tokens.css。
-->
<style>
  :root { --bg: #0b0d10; --panel: #111318; --ink: #f4f2ed; --ink-3: #8a8378; --champ: #e8cf9c; --rule: rgba(244,242,237,.12); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1800px; height: 1200px; background: var(--rule); display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: 1.7fr 1fr; gap: 2px; color: var(--ink); }
  .panel { position: relative; background: var(--panel); display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .tag { position: absolute; left: 28px; top: 24px; font-family: "Didot", serif; font-size: 20px; letter-spacing: .2em; color: var(--ink-3); }
  .tag b { color: var(--champ); font-weight: 400; margin-right: .6em; }
  .tag span { font-family: "Songti SC", serif; letter-spacing: .1em; }

  .seen { font-family: "Didot", "Bodoni 72", serif; font-size: 132px; letter-spacing: .14em; line-height: 1; padding-left: .14em; }
  .dot { display: inline-block; width: .17em; height: .17em; border-radius: 50%; background: var(--champ); margin-left: -.09em; vertical-align: baseline; box-shadow: 0 0 .35em rgba(232,207,156,.45); }
  .cn-sub { margin-top: 26px; font-family: "Songti SC", serif; font-weight: 900; font-size: 34px; letter-spacing: .9em; padding-left: .9em; color: var(--ink); }

  .mirror-row { display: flex; align-items: center; gap: 44px; }
  .mirror { position: relative; width: 92px; height: 150px; border: 7px solid var(--ink); border-radius: 46px 46px 46px 46px / 46px 46px 46px 46px; }
  .mirror::after { content: ""; position: absolute; left: 50%; top: 24px; width: 20px; height: 20px; margin-left: -10px; border-radius: 50%; background: var(--champ); box-shadow: 0 0 18px rgba(232,207,156,.55); }
  .seen.sm { font-size: 104px; }

  .cn { font-family: "Songti SC", serif; font-weight: 900; font-size: 150px; letter-spacing: .06em; line-height: 1; }
  .cn .stop { color: var(--champ); font-weight: 400; }
  .en-sub { margin-top: 24px; font-family: "Didot", serif; font-size: 28px; letter-spacing: .6em; padding-left: .6em; color: var(--ink-3); }

  .icons { display: flex; gap: 40px; align-items: center; }
  .icon { width: 200px; height: 200px; border-radius: 46px; background: var(--bg); border: 1px solid rgba(244,242,237,.16); display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
  .icon.small { width: 56px; height: 56px; border-radius: 13px; }
  .icon .s { font-family: "Didot", serif; font-size: 120px; line-height: 1; transform: translateY(-4px); }
  .icon .s .dot { box-shadow: 0 0 22px rgba(232,207,156,.5); }
  .icon.small .s { font-size: 34px; transform: translateY(-1px); }
  .icon .mirror { width: 74px; height: 122px; border-width: 6px; }
  .icon .mirror::after { top: 18px; width: 17px; height: 17px; margin-left: -8.5px; }
  .icon.small .mirror { width: 22px; height: 34px; border-width: 3px; border-radius: 11px; }
  .icon.small .mirror::after { top: 5px; width: 6px; height: 6px; margin-left: -3px; }
  .icon .yj { font-family: "Songti SC", serif; font-weight: 900; font-size: 96px; line-height: 1; }
  .icon .yj .stop { color: var(--champ); font-weight: 400; font-size: .5em; margin-left: -.1em; }
  .icon.small .yj { font-size: 28px; }
</style>
</head>
<body>
  <div class="panel"><div class="tag"><b>A</b><span>句点字标（推荐）</span></div>
    <div class="seen">SEEN<span class="dot"></span></div>
    <div class="cn-sub">衣见</div>
  </div>
  <div class="panel"><div class="tag"><b>B</b><span>镜面 + 字标</span></div>
    <div class="mirror-row"><div class="mirror"></div><div class="seen sm">SEEN</div></div>
  </div>
  <div class="panel"><div class="tag"><b>C</b><span>中文字标</span></div>
    <div class="cn">衣见<span class="stop">。</span></div>
    <div class="en-sub">SEEN</div>
  </div>

  <div class="panel"><div class="icons">
    <div class="icon"><div class="s">S<span class="dot"></span></div></div>
    <div class="icon small"><div class="s">S<span class="dot"></span></div></div>
  </div></div>
  <div class="panel"><div class="icons">
    <div class="icon"><div class="mirror"></div></div>
    <div class="icon small"><div class="mirror"></div></div>
  </div></div>
  <div class="panel"><div class="icons">
    <div class="icon"><div class="yj">见<span class="stop">。</span></div></div>
    <div class="icon small"><div class="yj">见<span class="stop">。</span></div></div>
  </div></div>
</body>
</html>

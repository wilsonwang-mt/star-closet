<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>SEEN logo 草图 v4 · 衣架的六种双关</title>
<!--
  v4：回到衣架方向，每个方案让衣架同时是另一样东西。
  H1 衣架×眼睛  H2 S 钩  H3 问号挂裙  H4 衣字衣架  H5 顶灯衣架  H6 放大镜衣架
  每格：大图形 + 字标，右下角为 48px 小图标测试。局部坐标 200×200。
-->
<style>
  :root { --bg: #0b0d10; --panel: #111318; --ink: #f4f2ed; --ink-3: #8a8378; --champ: #e8cf9c; --rule: rgba(244,242,237,.12); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 2100px; height: 1400px; background: var(--rule); display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: 1fr 1fr; gap: 2px; color: var(--ink); }
  .panel { position: relative; background: var(--panel); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; }
  .tag { position: absolute; left: 26px; top: 22px; font-family: "Didot", serif; font-size: 20px; letter-spacing: .2em; color: var(--ink-3); }
  .tag b { color: var(--champ); font-weight: 400; margin-right: .6em; }
  .tag span { font-family: "Songti SC", serif; letter-spacing: .08em; }
  .word { font-family: "Didot", "Bodoni 72", serif; font-size: 58px; letter-spacing: .32em; padding-left: .32em; line-height: 1; }
  .cnword { font-family: "Songti SC", serif; font-weight: 900; font-size: 56px; letter-spacing: .5em; padding-left: .5em; }
  .mini { position: absolute; right: 26px; bottom: 26px; width: 56px; height: 56px; border-radius: 13px; background: var(--bg); border: 1px solid rgba(244,242,237,.16); display: flex; align-items: center; justify-content: center; }
  svg { display: block; overflow: visible; }
</style>
</head>
<body>
  <div class="panel" data-k="eye"><div class="tag"><b>H1</b><span>衣架 × 眼睛</span></div></div>
  <div class="panel" data-k="shook"><div class="tag"><b>H2</b><span>S 钩</span></div></div>
  <div class="panel" data-k="dress"><div class="tag"><b>H3</b><span>问号挂裙</span></div></div>
  <div class="panel" data-k="yi"><div class="tag"><b>H4</b><span>衣字衣架</span></div></div>
  <div class="panel" data-k="lamp"><div class="tag"><b>H5</b><span>顶灯衣架</span></div></div>
  <div class="panel" data-k="lens"><div class="tag"><b>H6</b><span>放大镜衣架</span></div></div>
<script>
  const INK = "#f4f2ed", CHAMP = "#e8cf9c", BG = "#111318";
  const HOOK = (y) => `M 79 ${y - 36} A 21 21 0 1 1 112 ${y - 20} Q 100 ${y - 12} 100 ${y} `; // 问号弧 + 竖，止于 (100,y)

  const MARKS = {
    // 眼睛：上睑即斜肩，下睑即横杆，问号的点落成瞳孔
    eye: (sw) => `
      <path d="${HOOK(66)}" fill="none" stroke="${CHAMP}" stroke-width="${sw}" stroke-linecap="round"/>
      <path d="M 22 118 Q 100 34 178 118 Q 100 164 22 118 Z" fill="none" stroke="${INK}" stroke-width="${sw}" stroke-linejoin="round"/>
      <circle cx="100" cy="108" r="17" fill="${CHAMP}"/>`,
    // S 钩：上钩套在衣杆上，下钩开口
    shook: (sw) => `
      <line x1="24" y1="52" x2="176" y2="52" stroke="${INK}" stroke-width="${sw}" stroke-linecap="round"/>
      <path d="M 116.4 46 A 17 17 0 1 0 100 69 A 30 30 0 1 1 71.8 109.3" fill="none" stroke="${CHAMP}" stroke-width="${sw * 1.25}" stroke-linecap="round"/>`,
    // 问号挂裙：一笔画出领口、腰线和裙摆
    dress: (sw) => `
      <path d="${HOOK(62)}" fill="none" stroke="${CHAMP}" stroke-width="${sw}" stroke-linecap="round"/>
      <circle cx="100" cy="74" r="${sw * 1.1}" fill="${CHAMP}"/>
      <path d="M 100 74 L 66 90 L 80 124 L 50 184 Q 100 196 150 184 L 120 124 L 134 90 Z" fill="none" stroke="${INK}" stroke-width="${sw}" stroke-linejoin="round"/>`,
    // 衣字衣架：遮掉“衣”顶上的点，换成挂钩
    yi: (sw) => `
      <text x="100" y="178" text-anchor="middle" font-family="Songti SC" font-weight="900" font-size="168" fill="${INK}">衣</text>
      <rect x="70" y="8" width="60" height="44" fill="${BG}"/>
      <path d="${HOOK(52)}" fill="none" stroke="${CHAMP}" stroke-width="${sw * 1.3}" stroke-linecap="round"/>`,
    // 顶灯衣架：挂钩吊着灯，三角是光束，横杆是被照亮的地面
    lamp: (sw) => `
      <defs><linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${CHAMP}" stop-opacity=".95"/><stop offset="1" stop-color="${CHAMP}" stop-opacity=".08"/></linearGradient></defs>
      <path d="${HOOK(70)}" fill="none" stroke="${CHAMP}" stroke-width="${sw}" stroke-linecap="round"/>
      <path d="M 100 70 L 26 160 L 174 160 Z" fill="url(#beam)"/>
      <path d="M 100 70 L 26 160 L 174 160 Z" fill="none" stroke="${INK}" stroke-width="${sw * .6}" stroke-linejoin="round" opacity=".55"/>
      <line x1="20" y1="160" x2="180" y2="160" stroke="${INK}" stroke-width="${sw}" stroke-linecap="round"/>`,
    // 放大镜衣架：挂钩闭合成镜片，竖即镜柄
    lens: (sw) => `
      <circle cx="100" cy="42" r="24" fill="none" stroke="${CHAMP}" stroke-width="${sw}"/>
      <path d="M 86 36 A 15 15 0 0 1 98 26" fill="none" stroke="${CHAMP}" stroke-width="${sw * .5}" stroke-linecap="round" opacity=".8"/>
      <line x1="100" y1="66" x2="100" y2="84" stroke="${CHAMP}" stroke-width="${sw}" stroke-linecap="round"/>
      <path d="M 100 84 L 28 140 L 172 140 Z" fill="none" stroke="${INK}" stroke-width="${sw}" stroke-linejoin="round"/>`,
  };
  const WORD = { yi: '<div class="cnword">衣见</div>' };

  document.querySelectorAll(".panel").forEach((p) => {
    const k = p.dataset.k;
    p.insertAdjacentHTML("beforeend",
      `<svg width="300" height="300" viewBox="0 0 200 200">${MARKS[k](6)}</svg>` +
      (WORD[k] || '<div class="word">SEEN</div>') +
      `<div class="mini"><svg width="40" height="40" viewBox="0 0 200 200">${MARKS[k](13).replaceAll(BG, "#0b0d10")}</svg></div>`);
  });
</script>
</body>
</html>

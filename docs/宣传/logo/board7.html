<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>SEEN. 定制字标 v7</title>
<!--
  v7：顶灯衣架标准竖排 + 定制字母“SEEN.”。字母与衣架同一套笔画语言：
  - S 由两段圆弧拼成，上半弧即问号挂钩的弧；E 中横短于上下横；句点即灯泡。
  A 单线体（与衣架同粗、圆头）  B 横杆 E（E 去竖笔只剩三横）  C 粗细对比（竖粗横细，S 脊部加粗）
  上排：竖排组合；下排：字标放大看字形。字母坐标：大写高 100。
-->
<style>
  :root { --panel: #111318; --ink: #f4f2ed; --ink-3: #8a8378; --champ: #e8cf9c; --rule: rgba(244,242,237,.12); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 2400px; height: 1500px; background: var(--rule); display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: 1.25fr 1fr; gap: 2px; color: var(--ink); }
  .panel { position: relative; background: var(--panel); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 34px; }
  .tag { position: absolute; left: 26px; top: 22px; font-family: "Didot", serif; font-size: 20px; letter-spacing: .2em; color: var(--ink-3); }
  .tag b { color: var(--champ); font-weight: 400; margin-right: .6em; }
  .tag span { font-family: "Songti SC", serif; letter-spacing: .08em; }
  svg { display: block; overflow: visible; }
</style>
</head>
<body>
  <div class="panel" id="a1"><div class="tag"><b>A</b><span>单线体</span></div></div>
  <div class="panel" id="b1"><div class="tag"><b>B</b><span>横杆 E</span></div></div>
  <div class="panel" id="c1"><div class="tag"><b>C</b><span>粗细对比</span></div></div>
  <div class="panel" id="a2"></div>
  <div class="panel" id="b2"></div>
  <div class="panel" id="c2"></div>
<script>
  const INK = "#f4f2ed", CHAMP = "#e8cf9c";
  let uid = 0;

  // —— 顶灯衣架（同 v6 标准版）——
  const BX = 120, BY = 92, L = 36, R = 204, BAR = 148;
  const HOOK = `M 99 42 A 21 21 0 1 1 132 58 Q 120 66 120 76`;
  const SHOULDERS = `M ${L} ${BAR} Q 74 110 ${BX} ${BY} Q 166 110 ${R} ${BAR}`;
  function mark(sw = 5.5) {
    const id = `m${++uid}`;
    return `<defs><radialGradient id="${id}b" cx="${BX}" cy="${BY}" r="78" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="${CHAMP}" stop-opacity=".78"/><stop offset=".35" stop-color="${CHAMP}" stop-opacity=".32"/><stop offset="1" stop-color="${CHAMP}" stop-opacity="0"/></radialGradient><filter id="${id}g" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="7"/></filter></defs>
      <path d="${SHOULDERS} Z" fill="url(#${id}b)"/>
      <path d="${SHOULDERS}" fill="none" stroke="${INK}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="${L}" y1="${BAR}" x2="${R}" y2="${BAR}" stroke="${INK}" stroke-width="${sw}" stroke-linecap="round"/>
      <path d="${HOOK}" fill="none" stroke="${CHAMP}" stroke-width="${sw}" stroke-linecap="round"/>
      <circle cx="${BX}" cy="${BY}" r="13" fill="${CHAMP}" opacity=".7" filter="url(#${id}g)"/>
      <circle cx="${BX}" cy="${BY}" r="${sw * 1.35}" fill="#fff6e0"/>
      <circle cx="${BX}" cy="${BY}" r="${sw * 1.35}" fill="none" stroke="${CHAMP}" stroke-width="${sw * .5}"/>`;
  }

  // —— 定制字母 ——（大写高 100，基线 y=100）
  const st = (d, w, c = INK, cap = "round") => `<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="${cap}" stroke-linejoin="round"/>`;
  const flat = (d, w) => `<path d="${d}" fill="none" stroke="${INK}" stroke-width="${w}" stroke-linecap="square" clip-path="url(#cap)"/>`;
  // S：上下两个半径 25 的圆，上弧从右上逆时针绕到中点，下弧顺时针绕到左下
  const S_TOP = (x) => `M ${x + 56.6} 12.5 A 25 25 0 1 0 ${x + 35} 50`;
  const S_BOT = (x) => `M ${x + 35} 50 A 25 25 0 1 1 ${x + 13.4} 87.5`;
  // 粗细对比用：把 S 拆成四段，脊部两段加粗
  const S_PARTS = (x) => ({
    thin1: `M ${x + 56.6} 12.5 A 25 25 0 0 0 ${x + 10} 25`,
    spine: `M ${x + 10} 25 A 25 25 0 0 0 ${x + 35} 50 A 25 25 0 0 1 ${x + 60} 75`,
    thin2: `M ${x + 60} 75 A 25 25 0 0 1 ${x + 13.4} 87.5`,
  });


  // 粗细对比的 S：贝塞尔骨架（斜向脊部），按切线方向算笔画宽度——竖与斜粗、横细——逐点生成轮廓
  const S_SPINE = (x) => `M ${x + 60} 16 C ${x + 54} 5, ${x + 44} 2, ${x + 34} 2 C ${x + 18} 2, ${x + 8} 12, ${x + 8} 25 C ${x + 8} 40, ${x + 22} 45, ${x + 34} 50 C ${x + 48} 55, ${x + 60} 61, ${x + 60} 76 C ${x + 60} 90, ${x + 48} 98, ${x + 33} 98 C ${x + 20} 98, ${x + 9} 93, ${x + 5} 84`;
  function contrastS(x, thin = 3.6, thick = 15) {
    const NS = "http://www.w3.org/2000/svg";
    const tmp = document.createElementNS(NS, "svg"); document.body.appendChild(tmp);
    const p = document.createElementNS(NS, "path"); p.setAttribute("d", S_SPINE(x)); tmp.appendChild(p);
    const len = p.getTotalLength(), n = 240, left = [], right = [];
    for (let i = 0; i <= n; i++) {
      const l = len * i / n, a = p.getPointAtLength(Math.max(0, l - .5)), b = p.getPointAtLength(Math.min(len, l + .5)), c = p.getPointAtLength(l);
      const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1;
      const vert = Math.abs(dy / d);                       // 0 = 横向，1 = 竖向
      const taper = Math.min(1, i / 18, (n - i) / 18);      // 两端收细
      const w = (thin + (thick - thin) * Math.pow(vert, 1.6)) * (.55 + .45 * taper);
      const nx = -dy / d, ny = dx / d;
      left.push(`${(c.x + nx * w / 2).toFixed(2)} ${(c.y + ny * w / 2).toFixed(2)}`);
      right.push(`${(c.x - nx * w / 2).toFixed(2)} ${(c.y - ny * w / 2).toFixed(2)}`);
    }
    tmp.remove();
    return `<path d="M ${left.join(" L ")} L ${right.reverse().join(" L ")} Z" fill="${INK}" stroke="${INK}" stroke-width="1.2" stroke-linejoin="round"/>`;
  }

  const LETTER_W = { S: 70, E: 54, N: 72 };
  function bulb(cx, cy, r) {
    const id = `d${++uid}`;
    return `<defs><filter id="${id}" x="-300%" y="-300%" width="700%" height="700%"><feGaussianBlur stdDeviation="${r * 1.1}"/></filter></defs>
      <circle cx="${cx}" cy="${cy}" r="${r * 1.9}" fill="${CHAMP}" opacity=".75" filter="url(#${id})"/>
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="#fff6e0"/><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${CHAMP}" stroke-width="${r * .38}"/>`;
  }

  function wordmark(v) {
    const t = 9, gap = 46;
    let x = 0, out = "";
    for (const ch of ["S", "E", "E", "N"]) {
      if (ch === "S") {
        if (v === "C") out += contrastS(x);
        else out += st(S_TOP(x) + " " + S_BOT(x), t);
      }
      if (ch === "E") {
        if (v === "A") out += st(`M ${x + 54} 0 L ${x} 0 L ${x} 100 L ${x + 54} 100 M ${x} 50 L ${x + 38} 50`, t);
        if (v === "B") out += st(`M ${x} 0 L ${x + 54} 0 M ${x + 8} 50 L ${x + 46} 50 M ${x} 100 L ${x + 54} 100`, t);
        if (v === "C") out += flat(`M ${x + 7.5} 0 L ${x + 7.5} 100`, 15) + st(`M ${x + 7.5} 1.8 L ${x + 54} 1.8 M ${x + 7.5} 50 L ${x + 40} 50 M ${x + 7.5} 98.2 L ${x + 54} 98.2`, 3.6, INK, "butt");
      }
      if (ch === "N") {
        if (v === "C") out += st(`M ${x + 1.8} 100 L ${x + 1.8} 0 M ${x + 70.2} 0 L ${x + 70.2} 100`, 3.6, INK, "butt") + flat(`M ${x - 2} -6 L ${x + 74} 106`, 15);
        else out += st(`M ${x} 100 L ${x} 0 L ${x + 72} 100 L ${x + 72} 0`, t);
      }
      x += LETTER_W[ch] + gap;
    }
    // 句点 = 灯泡，贴近 N
    const px = x - gap + 30;
    out += bulb(px, 92, 8);
    return { svg: `<defs><clipPath id="cap"><rect x="-20" y="0" width="${px + 40}" height="100"/></clipPath></defs>` + out, w: px + 16 };
  }

  const svg = (w, h, vb, inner) => `<svg width="${w}" height="${h}" viewBox="${vb}">${inner}</svg>`;
  for (const v of ["A", "B", "C"]) {
    const wm = wordmark(v);
    const top = document.getElementById(v.toLowerCase() + "1");
    const bottom = document.getElementById(v.toLowerCase() + "2");
    // 竖排组合：衣架宽 300，字标宽约 360
    top.insertAdjacentHTML("beforeend",
      svg(300, 250, "0 0 240 200", mark()) +
      svg(360, 360 * 112 / wm.w, `-6 -6 ${wm.w + 12} 112`, wm.svg));
    bottom.insertAdjacentHTML("beforeend", svg(620, 620 * 112 / wm.w, `-6 -6 ${wm.w + 12} 112`, wm.svg));
  }
</script>
</body>
</html>

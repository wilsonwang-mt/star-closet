name: Verify static previews

on:
  push:
    branches: [main]
    paths: [.github/workflows/verify-static-preview.yml]
  workflow_run:
    workflows: [pages build and deployment]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check published HTML, PDF and concept image
        run: |
          python3 - <<'PY'
          import hashlib
          import time
          import urllib.request

          base = "https://wilsonwang-mt.github.io/star-closet/"
          checks = {
              "": "6530c134346dbf415759199145a4621b717b79dd054f97c60710f99281258784",
              "presentation/star-closet-hackathon.html": "95eeb76c004daf6343306b14b3aaa57f50f033290598c2a6da681c31c1dc2ab9",
              "design/preview.html": "6bbe0473f527f041c7bebf1eadbad00193115eefbb91da1e701591671b58749d",
              "presentation/star-closet-hackathon.pdf": "bd3e29017676091bde07cde99c4eb776fbddcf34ab54e612fc6080ae8b59ce7b",
              "design/concepts/platform-v03-atlas-20261015.png": "a24934dabd4bd5c9c5ecd0d3685249cb1b90f8f405c9d8a4b1aa28fe7c99e922",
              "design/concepts/visual-atlas-20261015.png": "64fe56a5e5754d71847cc0f5e946612092255f458ed9e28a32b64c9b6e9e0d0f"
          }
          for attempt in range(20):
              try:
                  for path, expected_hash in checks.items():
                      with urllib.request.urlopen(base + path, timeout=20) as response:
                          content = response.read()
                          if response.status != 200:
                              raise RuntimeError(f"HTTP {response.status}: {path}")
                          if expected_hash and hashlib.sha256(content).hexdigest() != expected_hash:
                              raise RuntimeError(f"Content mismatch: {path}")
                          if path.endswith(".html") or path == "":
                              text = content.decode("utf-8")
                              if "Star Closet" not in text:
                                  raise RuntimeError(f"Unexpected HTML: {path}")
                              if path.startswith("presentation/") and text.count('class="slide"') != 26:
                                  raise RuntimeError("Expected 26 slides")
                          print(f"HTTP 200, {len(content)} bytes: {base + path}", flush=True)
                  print("All static preview checks passed", flush=True)
                  break
              except Exception as error:
                  print(f"Attempt {attempt + 1}/20: {error}", flush=True)
                  if attempt == 19:
                      raise
                  time.sleep(15)
          PY
